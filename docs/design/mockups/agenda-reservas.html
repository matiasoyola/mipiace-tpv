<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda · Peluquería Sole — mockup Mi Piace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#E97058; --coral-dark:#C75A45; --coral-soft:#FDEAE3;
  --ink:#1F2937; --ink-soft:#374151; --stone:#F8F6F3;
  --slate200:#E5E7EB; --slate300:#CBD5E1; --slate400:#94A3B8; --slate500:#64748B;
  --pxmin:1.15;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'DM Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-feature-settings:'cv11','ss01';
  -webkit-font-smoothing:antialiased;
  background:var(--stone); color:var(--ink);
  font-size:14px; line-height:1.4;
}
.tabnum{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- top chrome ---------- */
.topbar{display:flex;align-items:center;gap:16px;padding:14px 20px;background:#fff;border-bottom:1px solid var(--slate200);position:sticky;top:0;z-index:40;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:-0.01em}
.brand .dot{width:26px;height:26px;border-radius:9px;background:var(--coral);display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px}
.seg{display:flex;background:var(--stone);border-radius:16px;padding:4px;gap:2px}
.seg button{padding:8px 16px;border-radius:12px;font-weight:500;font-size:13px;color:var(--slate500);transition:all .15s}
.seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.spacer{flex:1}
.hint{font-size:12px;color:var(--slate500)}

/* device note */
.devnote{padding:10px 20px;background:var(--coral-soft);color:var(--coral-dark);font-size:12.5px;font-weight:500;display:flex;gap:8px;align-items:center}

/* ---------- app frame ---------- */
.stage{padding:20px;display:flex;justify-content:center}
.app{background:#fff;border:1px solid var(--slate200);border-radius:24px;overflow:hidden;width:100%;max-width:1160px;position:relative;transition:max-width .2s}
body.surface-recepcion .app{max-width:1460px}
body.surface-movil .app{max-width:390px;border-radius:34px}

/* agenda header */
.ahead{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--slate200);flex-wrap:wrap}
.daynav{display:flex;align-items:center;gap:8px}
.daynav .today{font-weight:600;font-size:18px;letter-spacing:-0.01em}
.daynav small{color:var(--slate500);font-weight:400}
.chevron{width:34px;height:34px;border-radius:12px;background:var(--stone);display:grid;place-items:center;color:var(--ink-soft);font-size:16px}
.searchbar{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:6px;background:var(--stone);border:1px solid transparent;border-radius:14px;padding:8px 12px;font-size:13px}
.field select{border:none;background:transparent;font-family:inherit;font-size:13px;color:var(--ink);outline:none;font-weight:500}
.field label{color:var(--slate500);font-size:12px}
.btn{border-radius:14px;font-weight:500;font-size:13.5px;padding:9px 15px;transition:all .15s}
.btn-coral{background:var(--coral);color:#fff}
.btn-coral:hover{background:var(--coral-dark)}
.btn-ghost{background:var(--stone);color:var(--ink)}
.btn-ghost:hover{background:#EFEDE9}
.btn-ghost.on{background:var(--coral-soft);color:var(--coral-dark)}

/* week strip (recepción) */
.weekstrip{display:none;gap:6px;padding:12px 20px;border-bottom:1px solid var(--slate200);background:#fff}
body.surface-recepcion .weekstrip{display:flex}
.wday{flex:1;border-radius:14px;background:var(--stone);padding:8px 10px;text-align:center}
.wday.sel{background:var(--coral-soft)}
.wday .wd{font-size:11px;color:var(--slate500);text-transform:uppercase;letter-spacing:.06em}
.wday .wn{font-weight:600;font-size:16px;margin-top:2px}
.wday.sel .wn{color:var(--coral-dark)}
.wday .wc{font-size:11px;color:var(--slate500);margin-top:2px}

/* body layout */
.abody{display:flex}
.gridwrap{flex:1;overflow:auto;max-height:70vh}
.grid{display:flex;min-width:640px;position:relative}
.gutter{width:56px;flex:none;border-right:1px solid var(--slate200)}
.hourlabel{height:calc(60px * var(--pxmin));position:relative;font-size:11px;color:var(--slate400);padding-right:8px;text-align:right}
.hourlabel span{position:absolute;top:-7px;right:8px;background:#fff;padding:0 2px}
.col{flex:1;min-width:150px;border-right:1px solid var(--slate200);position:relative}
.colhead{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--slate200);padding:10px 8px;display:flex;align-items:center;gap:8px;justify-content:center}
.avatar{width:26px;height:26px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.colhead .nm{font-weight:600;font-size:14px}
.slots{position:relative}
.hourline{position:absolute;left:0;right:0;height:1px;background:var(--slate200)}
.halfline{position:absolute;left:0;right:0;height:1px;background:#F1EFEC}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--coral);z-index:8}
.nowline::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--coral)}
.nowtag{position:absolute;z-index:9;left:2px;transform:translateY(-50%);background:var(--coral);color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:8px}

/* appointment */
.appt{position:absolute;left:5px;right:5px;border-radius:12px;padding:7px 9px;overflow:hidden;cursor:pointer;border:1px solid;transition:transform .12s, box-shadow .12s}
.appt:hover{box-shadow:0 3px 10px rgba(31,41,55,.12);z-index:7}
.appt .at{font-size:11px;font-weight:600;opacity:.85}
.appt .ac{font-size:13px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt .as{font-size:11.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* states */
.st-pendiente{background:#FFFBEB;border-color:#FCD34D;color:#92400E}
.st-confirmada{background:var(--coral-soft);border-color:#F3B7A6;color:var(--coral-dark)}
.st-en_sala{background:#ECFDF5;border-color:#6EE7B7;color:#047857}
.st-en_sala::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#10B981}
.st-finalizada{background:#F4F3F1;border-color:var(--slate200);color:var(--slate500)}
.st-no_show{background:#FEF2F2;border-color:#FCA5A5;color:#B91C1C}
.appt.dim{opacity:.35}
.freeslot{position:absolute;left:5px;right:5px;border-radius:12px;border:1.5px dashed #34D399;background:rgba(16,185,129,.08);z-index:6;display:grid;place-items:center;color:#047857;font-size:11px;font-weight:600;cursor:pointer}
.freeslot:hover{background:rgba(16,185,129,.16)}

/* right rail (recepción) */
.rail{display:none;width:280px;flex:none;border-left:1px solid var(--slate200);padding:16px;overflow:auto;max-height:70vh}
body.surface-recepcion .rail{display:block}
.rail h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--slate400);font-weight:500;margin:6px 0 10px}
.railcard{border:1px solid var(--slate200);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.railcard .rt{font-weight:600;font-size:13px}
.railcard .rs{font-size:12px;color:var(--slate500)}
.dotmini{width:8px;height:8px;border-radius:50%;flex:none}

/* móvil list */
.movil-list{display:none;padding:12px;max-height:74vh;overflow:auto}
body.surface-movil .movil-list{display:block}
body.surface-movil .abody{display:none}
body.surface-movil .weekstrip{display:none}
.mpills{display:flex;gap:6px;overflow:auto;padding:4px 0 12px}
.mpill{white-space:nowrap;padding:7px 13px;border-radius:14px;background:var(--stone);font-size:13px;font-weight:500;color:var(--slate500)}
.mpill.on{background:var(--coral-soft);color:var(--coral-dark)}
.mrow{display:flex;gap:12px;padding:13px;border:1px solid var(--slate200);border-radius:18px;margin-bottom:8px;align-items:center}
.mrow .mtime{font-weight:600;font-size:15px;width:46px;flex:none}
.mrow .mmid{flex:1;min-width:0}
.mrow .mc{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .ms{font-size:12.5px;color:var(--slate500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px}
.mfab{position:absolute;right:16px;bottom:16px;height:56px;padding:0 20px;border-radius:20px;background:var(--coral);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(233,112,88,.4)}

/* legend */
.legend{display:flex;gap:14px;padding:12px 20px;border-top:1px solid var(--slate200);flex-wrap:wrap;font-size:12px;color:var(--ink-soft)}
.legend span{display:flex;align-items:center;gap:6px}
.lg{width:12px;height:12px;border-radius:4px;border:1px solid}

/* drawer / sheet */
.scrim{position:fixed;inset:0;background:rgba(31,41,55,.35);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:#fff;z-index:70;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.drawer.show{transform:none}
body.surface-movil .drawer{top:auto;left:0;right:0;width:100%;max-width:100%;border-radius:24px 24px 0 0;transform:translateY(100%)}
body.surface-movil .drawer.show{transform:none}
.dhead{padding:18px 20px;border-bottom:1px solid var(--slate200);display:flex;align-items:center;justify-content:space-between}
.dhead h3{font-size:18px;font-weight:600;letter-spacing:-0.01em}
.dclose{width:34px;height:34px;border-radius:12px;background:var(--stone);display:grid;place-items:center;font-size:18px;color:var(--ink-soft)}
.dbody{padding:20px;overflow:auto;flex:1}
.frow{margin-bottom:16px}
.frow>label{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);margin-bottom:6px}
.input,.selectbig{width:100%;height:50px;background:var(--stone);border:1px solid transparent;border-radius:16px;padding:0 14px;font-family:inherit;font-size:14.5px;color:var(--ink);outline:none}
.input:focus,.selectbig:focus{background:#fff;border-color:#F3B7A6;box-shadow:0 0 0 3px rgba(233,112,88,.18)}
.durpill{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--slate500)}
.statuspick{display:flex;flex-wrap:wrap;gap:7px}
.statuspick button{border:1px solid var(--slate200);border-radius:12px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--slate500);background:#fff}
.statuspick button.sel{border-color:transparent}
.dfoot{padding:16px 20px;border-top:1px solid var(--slate200);display:flex;gap:10px}
.dfoot .btn{flex:1;height:56px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.detailmeta{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.detailmeta .mline{display:flex;justify-content:space-between;font-size:14px;padding-bottom:10px;border-bottom:1px solid #F1EFEC}
.detailmeta .mline b{font-weight:600}
.detailmeta .mline span{color:var(--slate500)}

/* undo banner */
.undo{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);z-index:90;background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:16px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.25);transition:transform .25s}
.undo.show{transform:translateX(-50%)}
.undo button{color:#FDBBA9;font-weight:600}
.pay-ok{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);z-index:90;background:#047857;color:#fff;border-radius:16px;padding:12px 18px;font-size:13.5px;font-weight:500;display:flex;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25);transition:transform .25s}
.pay-ok.show{transform:translateX(-50%)}
</style>
</head>
<body class="surface-tpv">

<div class="topbar">
  <div class="brand"><div class="dot">mp</div> Mi Piace · Agenda</div>
  <div class="seg" id="seg">
    <button data-s="tpv" class="active">Terminal TPV</button>
    <button data-s="recepcion">Recepción</button>
    <button data-s="movil">Móvil profesional</button>
  </div>
  <div class="spacer"></div>
  <div class="hint">Mockup · datos de ejemplo · Peluquería Sole</div>
</div>
<div class="devnote" id="devnote"></div>

<div class="stage">
  <div class="app">

    <!-- agenda header -->
    <div class="ahead">
      <div class="daynav">
        <button class="chevron">‹</button>
        <div class="today">Hoy, martes 4 ago <small>· 15 citas</small></div>
        <button class="chevron">›</button>
      </div>
      <div class="searchbar">
        <div class="field">
          <label>Servicio</label>
          <select id="bh-serv"></select>
        </div>
        <div class="field">
          <label>Profesional</label>
          <select id="bh-prof"><option value="any">Cualquiera</option></select>
        </div>
        <button class="btn btn-ghost" id="bh-btn">Buscar hueco</button>
        <button class="btn btn-coral" id="add-btn">+ Nueva cita</button>
      </div>
    </div>

    <!-- week strip (recepción) -->
    <div class="weekstrip" id="weekstrip"></div>

    <!-- grid -->
    <div class="abody">
      <div class="gridwrap">
        <div class="grid" id="grid"></div>
      </div>
      <div class="rail" id="rail"></div>
    </div>

    <!-- móvil list -->
    <div class="movil-list">
      <div class="mpills" id="mpills"></div>
      <div id="movilrows"></div>
      <button class="mfab" id="mfab">+ Cita</button>
    </div>

    <!-- legend -->
    <div class="legend">
      <span><i class="lg st-pendiente" style="background:#FFFBEB;border-color:#FCD34D"></i> Pendiente</span>
      <span><i class="lg st-confirmada" style="background:var(--coral-soft);border-color:#F3B7A6"></i> Confirmada</span>
      <span><i class="lg st-en_sala" style="background:#ECFDF5;border-color:#6EE7B7"></i> En sala</span>
      <span><i class="lg st-finalizada" style="background:#F4F3F1;border-color:#E5E7EB"></i> Finalizada</span>
      <span><i class="lg st-no_show" style="background:#FEF2F2;border-color:#FCA5A5"></i> No-show</span>
    </div>

  </div>
</div>

<!-- drawer -->
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="dhead"><h3 id="dtitle">Nueva cita</h3><button class="dclose" id="dclose">×</button></div>
  <div class="dbody" id="dbody"></div>
  <div class="dfoot" id="dfoot"></div>
</div>

<div class="undo" id="undo"></div>
<div class="pay-ok" id="payok"></div>

<script>
const DAY_START=9*60, DAY_END=20*60, PXMIN=1.15;
const profs=[
  {id:'sole',name:'Sole',color:'#E97058'},
  {id:'marta',name:'Marta',color:'#6366F1'},
  {id:'nerea',name:'Nerea',color:'#0EA5A4'},
];
const services=[
  {id:'corte',name:'Corte',dur:30},
  {id:'cortepeinar',name:'Corte, lavar y peinar',dur:45},
  {id:'tinte',name:'Tinte',dur:90},
  {id:'mechas',name:'Mechas',dur:120},
  {id:'peinado',name:'Peinado',dur:30},
  {id:'recogido',name:'Recogido',dur:45},
  {id:'barba',name:'Arreglo de barba',dur:20},
];
const svc=id=>services.find(s=>s.id===id);
const prof=id=>profs.find(p=>p.id===id);
let uid=100;
let appts=[
  {id:1,prof:'sole',service:'tinte',client:'María López',start:9*60+30,status:'finalizada'},
  {id:2,prof:'sole',service:'corte',client:'Carmen Ruiz',start:11*60+15,status:'finalizada'},
  {id:3,prof:'sole',service:'mechas',client:'Lucía Prieto',start:12*60,status:'en_sala'},
  {id:4,prof:'sole',service:'cortepeinar',client:'Ana Gil',start:14*60+30,status:'confirmada'},
  {id:5,prof:'sole',service:'recogido',client:'Sara Moreno',start:17*60,status:'pendiente'},
  {id:6,prof:'marta',service:'corte',client:'Jorge Sanz',start:10*60,status:'finalizada'},
  {id:7,prof:'marta',service:'peinado',client:'Elena Vidal',start:10*60+45,status:'finalizada'},
  {id:8,prof:'marta',service:'tinte',client:'Rosa Díaz',start:12*60+30,status:'en_sala'},
  {id:9,prof:'marta',service:'mechas',client:'Marta Núñez',start:16*60,status:'confirmada'},
  {id:10,prof:'marta',service:'corte',client:'Pablo León',start:18*60+30,status:'pendiente'},
  {id:11,prof:'nerea',service:'barba',client:'Iván Torres',start:9*60+15,status:'finalizada'},
  {id:12,prof:'nerea',service:'corte',client:'Diego Ramos',start:10*60+30,status:'no_show'},
  {id:13,prof:'nerea',service:'cortepeinar',client:'Noa Ferrer',start:11*60+30,status:'finalizada'},
  {id:14,prof:'nerea',service:'peinado',client:'Clara Ibáñez',start:13*60,status:'confirmada'},
  {id:15,prof:'nerea',service:'corte',client:'Hugo Blanco',start:16*60+30,status:'pendiente'},
];
const NOW=12*60+40;
const stName={pendiente:'Pendiente',confirmada:'Confirmada',en_sala:'En sala',finalizada:'Finalizada',no_show:'No-show'};
const stOrder=['pendiente','confirmada','en_sala','finalizada','no_show'];
const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');

let buscar=null; // {service,prof}
let movilProf='all';

/* ---------- grid ---------- */
function renderGrid(){
  const grid=document.getElementById('grid');
  let html='<div class="gutter"><div style="height:41px"></div>';
  for(let h=9;h<20;h++) html+=`<div class="hourlabel"><span>${String(h).padStart(2,'0')}:00</span></div>`;
  html+='</div>';
  profs.forEach(p=>{
    html+=`<div class="col" data-prof="${p.id}">
      <div class="colhead"><span class="avatar" style="background:${p.color}">${p.name[0]}</span><span class="nm">${p.name}</span></div>
      <div class="slots" data-prof="${p.id}" style="height:${(DAY_END-DAY_START)*PXMIN}px">`;
    for(let h=9;h<=20;h++){const t=(h*60-DAY_START)*PXMIN; html+=`<div class="hourline" style="top:${t}px"></div>`; if(h<20) html+=`<div class="halfline" style="top:${t+30*PXMIN}px"></div>`;}
    // now line
    if(NOW>=DAY_START&&NOW<=DAY_END){const t=(NOW-DAY_START)*PXMIN; html+=`<div class="nowline" style="top:${t}px"></div>`;}
    // free slots (buscar hueco)
    if(buscar && (buscar.prof==='any'||buscar.prof===p.id)){
      freeSlots(p.id,svc(buscar.service).dur).forEach(fs=>{
        const top=(fs-DAY_START)*PXMIN, h=svc(buscar.service).dur*PXMIN;
        html+=`<div class="freeslot" style="top:${top}px;height:${h}px" data-prof="${p.id}" data-start="${fs}">${fmt(fs)} · libre</div>`;
      });
    }
    // appts
    appts.filter(a=>a.prof===p.id).forEach(a=>{
      const s=svc(a.service),top=(a.start-DAY_START)*PXMIN,h=s.dur*PXMIN;
      const dim=buscar?'dim':'';
      html+=`<div class="appt st-${a.status} ${dim}" data-id="${a.id}" style="top:${top}px;height:${h}px">
        <div class="at tabnum">${fmt(a.start)}</div>
        <div class="ac">${a.client}</div>
        <div class="as">${s.name} · ${s.dur}′</div></div>`;
    });
    if(NOW>=DAY_START&&NOW<=DAY_END){const t=(NOW-DAY_START)*PXMIN; html+=`<div class="nowtag" style="top:${t}px">ahora</div>`;}
    html+='</div></div>';
  });
  grid.innerHTML=html;
  grid.querySelectorAll('.appt:not(.dim)').forEach(el=>el.onclick=()=>openDetail(+el.dataset.id));
  grid.querySelectorAll('.appt.dim').forEach(el=>el.onclick=()=>openDetail(+el.dataset.id));
  grid.querySelectorAll('.freeslot').forEach(el=>el.onclick=()=>openAdd(el.dataset.prof,+el.dataset.start,buscar.service));
  grid.querySelectorAll('.slots').forEach(sl=>sl.addEventListener('click',e=>{
    if(e.target!==sl) return;
    const rect=sl.getBoundingClientRect();
    let min=DAY_START+Math.round(((e.clientY-rect.top)/PXMIN)/15)*15;
    openAdd(sl.dataset.prof,min,null);
  }));
}
function freeSlots(profId,dur){
  const busy=appts.filter(a=>a.prof===profId&&a.status!=='no_show').map(a=>[a.start,a.start+svc(a.service).dur]).sort((x,y)=>x[0]-y[0]);
  const out=[]; let t=Math.max(DAY_START,NOW); // solo huecos futuros
  t=Math.ceil(t/15)*15;
  while(t+dur<=DAY_END){
    const clash=busy.some(b=>t<b[1]&&t+dur>b[0]);
    if(!clash){out.push(t); t+=Math.max(dur,30);} else t+=15;
    if(out.length>=4) break;
  }
  return out;
}

/* ---------- week strip ---------- */
function renderWeek(){
  const days=[['lun','2'],['mar','3'],['mié','4'],['jue','5'],['vie','6'],['sáb','7'],['dom','8']];
  document.getElementById('weekstrip').innerHTML=days.map((d,i)=>
    `<div class="wday ${d[1]==='4'?'sel':''}"><div class="wd">${d[0]}</div><div class="wn tabnum">${d[1]}</div><div class="wc">${[9,11,15,12,14,18,0][i]} citas</div></div>`).join('');
}

/* ---------- right rail ---------- */
function renderRail(){
  const enSala=appts.filter(a=>a.status==='en_sala');
  const prox=appts.filter(a=>a.start>=NOW&&a.status!=='no_show').sort((a,b)=>a.start-b.start).slice(0,5);
  const card=a=>{const p=prof(a.prof);return `<div class="railcard"><span class="dotmini" style="background:${p.color}"></span><div style="flex:1"><div class="rt">${a.client}</div><div class="rs">${svc(a.service).name} · ${p.name}</div></div><div class="rt tabnum">${fmt(a.start)}</div></div>`;};
  document.getElementById('rail').innerHTML=
    `<h4>En sala ahora (${enSala.length})</h4>${enSala.map(card).join('')||'<div class="rs">Nadie en sala</div>'}
     <h4 style="margin-top:18px">Próximas</h4>${prox.map(card).join('')}`;
}

/* ---------- móvil ---------- */
function renderMovil(){
  document.getElementById('mpills').innerHTML=
    `<button class="mpill ${movilProf==='all'?'on':''}" data-p="all">Todos</button>`+
    profs.map(p=>`<button class="mpill ${movilProf===p.id?'on':''}" data-p="${p.id}">${p.name}</button>`).join('');
  document.querySelectorAll('.mpill').forEach(b=>b.onclick=()=>{movilProf=b.dataset.p;renderMovil();});
  const list=appts.filter(a=>movilProf==='all'||a.prof===movilProf).sort((a,b)=>a.start-b.start);
  const sc={pendiente:'st-pendiente',confirmada:'st-confirmada',en_sala:'st-en_sala',finalizada:'st-finalizada',no_show:'st-no_show'};
  document.getElementById('movilrows').innerHTML=list.map(a=>{
    const p=prof(a.prof);
    return `<div class="mrow" data-id="${a.id}"><div class="mtime tabnum">${fmt(a.start)}</div>
      <div class="mmid"><div class="mc">${a.client}</div><div class="ms">${svc(a.service).name} · ${p.name} · ${svc(a.service).dur}′</div></div>
      <span class="chip ${sc[a.status]}">${stName[a.status]}</span></div>`;
  }).join('')||'<div class="rs" style="padding:20px;text-align:center;color:#94A3B8">Sin citas para este filtro</div>';
  document.querySelectorAll('.mrow').forEach(r=>r.onclick=()=>openDetail(+r.dataset.id));
}

/* ---------- drawer: add ---------- */
function openAdd(profId,start,serviceId){
  const drawer=document.getElementById('drawer');
  document.getElementById('dtitle').textContent='Nueva cita';
  const startR=start?Math.round(start/15)*15:NOW;
  document.getElementById('dbody').innerHTML=`
    <div class="frow"><label>Cliente</label><input class="input" id="f-client" placeholder="Buscar o crear cliente…" value=""></div>
    <div class="frow"><label>Servicio</label><select class="selectbig" id="f-serv">${services.map(s=>`<option value="${s.id}" ${s.id===serviceId?'selected':''}>${s.name} · ${s.dur}′</option>`).join('')}</select>
      <div class="durpill" id="f-dur"></div></div>
    <div class="frow"><label>Profesional</label><select class="selectbig" id="f-prof">${profs.map(p=>`<option value="${p.id}" ${p.id===profId?'selected':''}>${p.name}</option>`).join('')}</select></div>
    <div class="frow"><label>Hora</label><input class="input tabnum" id="f-time" value="${fmt(startR)}"></div>`;
  document.getElementById('dfoot').innerHTML=`<button class="btn btn-ghost" id="f-cancel">Cancelar</button><button class="btn btn-coral" id="f-save">Reservar cita</button>`;
  const durline=()=>{const s=svc(document.getElementById('f-serv').value);document.getElementById('f-dur').textContent=`Bloquea ${s.dur} min · termina a las ${fmt((parseInt(document.getElementById('f-time').value.split(':')[0])*60+parseInt(document.getElementById('f-time').value.split(':')[1]))+s.dur)}`;};
  document.getElementById('f-serv').onchange=durline; document.getElementById('f-time').oninput=durline; durline();
  document.getElementById('f-cancel').onclick=closeDrawer;
  document.getElementById('f-save').onclick=()=>{
    const c=document.getElementById('f-client').value.trim()||'Cliente nuevo';
    const sid=document.getElementById('f-serv').value, pid=document.getElementById('f-prof').value;
    const[hh,mm]=document.getElementById('f-time').value.split(':').map(Number);
    const na={id:++uid,prof:pid,service:sid,client:c,start:hh*60+mm,status:'confirmada'};
    appts.push(na); closeDrawer(); renderAll();
    showUndo(`Cita de ${c} a las ${fmt(na.start)} creada`,()=>{appts=appts.filter(a=>a.id!==na.id);renderAll();});
  };
  openDrawer();
}

/* ---------- drawer: detail ---------- */
function openDetail(id){
  const a=appts.find(x=>x.id===id); if(!a) return;
  const s=svc(a.service),p=prof(a.prof);
  document.getElementById('dtitle').textContent=a.client;
  document.getElementById('dbody').innerHTML=`
    <div class="detailmeta">
      <div class="mline"><span>Servicio</span><b>${s.name}</b></div>
      <div class="mline"><span>Profesional</span><b>${p.name}</b></div>
      <div class="mline"><span>Horario</span><b class="tabnum">${fmt(a.start)}–${fmt(a.start+s.dur)} · ${s.dur}′</b></div>
    </div>
    <div class="frow"><label>Estado</label><div class="statuspick" id="d-status">
      ${stOrder.map(st=>`<button data-st="${st}" class="${a.status===st?'sel st-'+st:''}">${stName[st]}</button>`).join('')}
    </div></div>`;
  document.getElementById('dfoot').innerHTML=`<button class="btn btn-ghost" id="d-del">Cancelar cita</button><button class="btn btn-coral" id="d-pay">Cobrar en caja →</button>`;
  document.querySelectorAll('#d-status button').forEach(b=>b.onclick=()=>{a.status=b.dataset.st;openDetail(id);renderAll();});
  document.getElementById('d-del').onclick=()=>{const bk={...a};appts=appts.filter(x=>x.id!==id);closeDrawer();renderAll();showUndo(`Cita de ${bk.client} cancelada`,()=>{appts.push(bk);renderAll();});};
  document.getElementById('d-pay').onclick=()=>{a.status='finalizada';closeDrawer();renderAll();showPay(`Ticket abierto en caja · ${a.client} · ${s.name}`);};
  openDrawer();
}

/* ---------- helpers ---------- */
function openDrawer(){document.getElementById('scrim').classList.add('show');document.getElementById('drawer').classList.add('show');}
function closeDrawer(){document.getElementById('scrim').classList.remove('show');document.getElementById('drawer').classList.remove('show');}
document.getElementById('dclose').onclick=closeDrawer;
document.getElementById('scrim').onclick=closeDrawer;
let undoT;
function showUndo(msg,fn){const u=document.getElementById('undo');u.innerHTML=`<span>${msg}</span><button>Deshacer</button>`;u.querySelector('button').onclick=()=>{clearTimeout(undoT);fn();u.classList.remove('show');};u.classList.add('show');clearTimeout(undoT);undoT=setTimeout(()=>u.classList.remove('show'),4000);}
let payT;
function showPay(msg){const u=document.getElementById('payok');u.innerHTML=`✓ ${msg}`;u.classList.add('show');clearTimeout(payT);payT=setTimeout(()=>u.classList.remove('show'),3200);}

/* ---------- buscar hueco ---------- */
document.getElementById('bh-btn').onclick=function(){
  if(buscar){buscar=null;this.classList.remove('on');this.textContent='Buscar hueco';}
  else{buscar={service:document.getElementById('bh-serv').value,prof:document.getElementById('bh-prof').value};this.classList.add('on');this.textContent='Ver todo';}
  renderAll();
};
document.getElementById('add-btn').onclick=()=>openAdd(null,null,null);
document.getElementById('mfab').onclick=()=>openAdd(null,null,null);

/* ---------- surface switch ---------- */
const devnotes={
  tpv:'Terminal TPV · vista de día con columnas por profesional. Aquí la cita se cobra: tocas la cita → "Cobrar en caja" y el ticket sale pre-poblado.',
  recepcion:'Recepción, pantalla grande · misma agenda ensanchada con tira de semana y panel lateral "en sala / próximas". Centro de mando.',
  movil:'Móvil del profesional · se colapsa a "mi día" en una columna. Filtra por profesional, toca una cita para ver o cobrar.'
};
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.body.className='surface-'+b.dataset.s;
  document.getElementById('devnote').textContent=devnotes[b.dataset.s];
});

/* ---------- init ---------- */
document.getElementById('bh-serv').innerHTML=services.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
document.getElementById('bh-prof').innerHTML='<option value="any">Cualquiera</option>'+profs.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
document.getElementById('devnote').textContent=devnotes.tpv;
function renderAll(){renderGrid();renderWeek();renderRail();renderMovil();}
renderAll();
// scroll grid to ~ now
setTimeout(()=>{const gw=document.querySelector('.gridwrap');if(gw)gw.scrollTop=(NOW-DAY_START)*PXMIN-160;},50);
</script>
