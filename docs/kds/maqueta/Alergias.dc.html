<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>TPV · alergias por silla</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2A08F}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1443px; height: 812px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #07080A; font-family: 'DM Sans', system-ui, sans-serif; color: #F1F3F5;">

  <div style="width: 1300px; height: 740px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 22px; background: #171A1F; border: 1px solid #2C313A; overflow: hidden;">

    <!-- Cabecera -->
    <div style="height: 76px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 20px; border-bottom: 1px solid #23272E;">
      <span style="font-size: 28px; font-weight: 700; letter-spacing: -0.01em;">Alergias · M5</span>
      <span style="font-size: 17px; color: #9AA2AF;">toca la silla y luego el alérgeno</span>
      <span style="flex-grow: 1;"></span>
      <button style="height: 56px; padding: 0 28px; border-radius: 14px; border: 0; background: #F1F3F5; color: #0E1013; font-size: 21px; font-weight: 700;">Listo</button>
    </div>

    <div style="flex-grow: 1; min-height: 0; display: flex;">

      <!-- La mesa y sus sillas -->
      <div style="width: 460px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 20px; box-sizing: border-box; border-right: 1px solid #23272E;">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: #9AA2AF;">LA BARRA ESTÁ A ESTE LADO</span>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
          <div style="display: flex; gap: 40px;">
            <button style="width: 104px; height: 88px; border-radius: 20px; border: 0; background: #2C313A; color: #F1F3F5; font-size: 30px; font-weight: 700;">1</button>
            <button style="width: 104px; height: 88px; border-radius: 20px; border: 0; background: #2C313A; color: #F1F3F5; font-size: 30px; font-weight: 700;">2</button>
          </div>
          <div style="width: 300px; height: 150px; border-radius: 18px; background: #23272E; border: 2px solid #3A404A; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; color: #9AA2AF;">M5</div>
          <div style="display: flex; gap: 40px;">
            <button style="width: 104px; height: 88px; border-radius: 20px; border: 0; background: #2C313A; color: #F1F3F5; font-size: 30px; font-weight: 700;">4</button>
            <button style="width: 104px; height: 88px; border-radius: 20px; border: 0; background: #C8102E; color: #FFFFFF; box-shadow: 0 0 0 4px #171A1F, 0 0 0 7px #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
              <span style="font-size: 30px; font-weight: 700; line-height: 1;">3</span>
              <span style="font-size: 14px; font-weight: 700;">gluten</span>
            </button>
          </div>
        </div>

        <button style="height: 52px; padding: 0 22px; border-radius: 14px; border: 1px solid #3A404A; background: transparent; color: #C3C9D2; font-size: 18px; font-weight: 600;">No sé la silla · toda la mesa</button>
      </div>

      <!-- Los 14 alérgenos -->
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 20px; box-sizing: border-box;">
        <div style="display: flex; align-items: baseline; gap: 12px;">
          <span style="font-size: 22px; font-weight: 700;">Silla 3</span>
          <span style="font-size: 16px; color: #9AA2AF;">los 14 de declaración obligatoria</span>
        </div>
        <div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 10px;">
          <sc-for list="{{alg}}" as="a" hint-placeholder-count="14">
            <button style="border-radius: 14px; font-size: 22px; font-weight: 600; text-align: left; padding: 0 18px; {{a.style}}">{{a.name}}</button>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1443,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Gluten','Crustáceos','Huevos','Pescado','Cacahuetes','Soja','Lácteos','Frutos de cáscara','Apio','Mostaza','Sésamo','Sulfitos','Altramuces','Moluscos'];
    const alg = names.map(name => ({
      name,
      style: name === 'Gluten'
        ? 'border: 0; background: #C8102E; color: #FFFFFF; box-shadow: 0 0 0 3px #171A1F, 0 0 0 6px #FFFFFF;'
        : 'border: 1px solid #3A404A; background: #1F2329; color: #F1F3F5;'
    }));
    return { alg };
  }
}
</script>
</body>
</html>
