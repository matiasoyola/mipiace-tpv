<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fotos, consentimientos e informe · mockup clinica-4</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--coral:#E97058;--coral-dark:#C75A45;--coral-soft:#FDEAE3;--ink:#1F2937;--ink-soft:#374151;--stone:#F8F6F3;
--slate-100:#F1F5F9;--slate-200:#E2E8F0;--slate-300:#CBD5E1;--slate-500:#64748B;--em-50:#ECFDF5;--em-700:#047857;--amber-50:#FFFBEB;--amber-700:#B45309;--mp-ease-out:cubic-bezier(0.23,1,0.32,1)}
*{box-sizing:border-box}html{-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'DM Sans',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#EDEAE5;color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;touch-action:manipulation;user-select:none;transition:transform 120ms var(--mp-ease-out),background-color 150ms ease}
button:active{transform:scale(.97)}button:disabled{opacity:.45;cursor:not-allowed}
.mockbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.mockbar strong{font-weight:600;margin-right:8px}.mockbar button{background:#374151;color:#fff;border-radius:10px;padding:8px 12px;font-size:13px}.mockbar button.on{background:var(--coral)}
.mockbar .note{opacity:.7;margin-left:auto}
.stage{display:flex;justify-content:center;padding:24px 16px 40px}
.device{background:var(--stone);border-radius:28px;border:10px solid #2a2f38;width:100%;max-width:1180px;overflow:hidden}
.main{padding:22px 26px 28px}
.name{font-size:23px;font-weight:600;letter-spacing:-0.01em;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fact{background:#fff;border:1px solid var(--slate-200);border-radius:12px;padding:6px 12px;font-size:14px}.fact span{display:block;font-size:11px;color:var(--slate-500)}
.alerts{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 0;padding:14px 16px;background:#B91C1C;border-radius:16px;align-items:center;color:#fff}
.alerts .lbl{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-right:6px}
.alerts .a{background:#fff;color:#991B1B;border-radius:12px;padding:8px 14px;font-size:16px;font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 0;background:#fff;border:1px solid var(--slate-200);border-radius:16px;padding:5px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{height:44px;padding:0 18px;border-radius:12px;background:transparent;color:var(--slate-500);font-weight:500;font-size:14.5px;white-space:nowrap}
.tabs button.on{background:var(--coral-soft);color:var(--coral-dark)}
.card{background:#fff;border:1px solid var(--slate-200);border-radius:24px;padding:18px 22px;margin-top:16px}
.card h2{font-size:16.5px;font-weight:600;margin:0}.sub{font-size:13px;color:var(--slate-500);margin:3px 0 12px}
.label{font-size:13px;font-weight:500;color:var(--ink-soft);margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:14px;background:#fff;border:1.5px solid var(--slate-200);font-size:14px;color:var(--ink)}
.chip.on{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-dark);font-weight:500}
.cta{background:var(--coral);color:#fff;font-weight:500;font-size:16px;height:60px;padding:0 26px;border-radius:18px}
.ghost{background:var(--stone);color:var(--ink);font-weight:500;height:48px;padding:0 18px;border-radius:14px;font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
.why{font-size:13.5px;color:var(--amber-700)}
.ok{display:flex;gap:10px;align-items:center;background:var(--em-50);color:var(--em-700);border-radius:16px;padding:12px 14px;font-size:14px;margin-top:14px}
.small{font-size:12.5px;color:var(--slate-500)}
/* fotos */
.cam{position:relative;background:#111;border-radius:20px;height:320px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cam .ph{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,#d9a58f,#8a5a49 60%,#2b1d18)}
.cam .guide{position:absolute;inset:40px 30%;border:2px dashed rgba(255,255,255,.6);border-radius:40% 40% 30% 30%}
.shutter{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;background:#fff;border:6px solid rgba(255,255,255,.4)}
.shutter:active{transform:translateX(-50%) scale(.95)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.thumb{border-radius:16px;overflow:hidden;border:1px solid var(--slate-200);background:#fff;text-align:left;padding:0}
.thumb .img{height:110px}
.thumb .t{padding:8px 10px;font-size:12.5px;color:var(--ink-soft)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp .img{height:220px;border-radius:16px}
.cmp .cap{font-size:13px;margin-top:6px;color:var(--ink-soft)}
/* consentimiento */
.doc{background:var(--stone);border-radius:16px;padding:16px 18px;font-size:15px;line-height:1.6;max-height:220px;overflow:auto}
.sig{margin-top:12px;border:2px dashed var(--slate-300);border-radius:16px;background:#fff;position:relative;touch-action:none}
.sig canvas{display:block;width:100%;height:180px}
.sig .hint{position:absolute;left:16px;bottom:12px;font-size:13px;color:var(--slate-500);pointer-events:none}
/* informe */
.two{display:grid;grid-template-columns:360px 1fr;gap:16px}
.paper{background:#fff;border:1px solid var(--slate-200);border-radius:8px;padding:28px 30px;box-shadow:0 1px 2px rgba(0,0,0,.04);font-size:13px;line-height:1.55;min-height:520px}
.paper h3{font-size:16px;margin:0 0 2px;font-weight:600}
.paper .hd{display:flex;justify-content:space-between;border-bottom:1px solid var(--slate-200);padding-bottom:10px;margin-bottom:14px}
.paper .sec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-500);margin:14px 0 4px}
.paper table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.paper td{padding:4px 0;border-bottom:1px solid var(--slate-100)}
.opt{display:block;width:100%;text-align:left;min-height:64px;padding:12px 14px;border-radius:16px;background:var(--stone);margin-bottom:8px;color:var(--ink)}
.opt b{display:block;font-weight:600;font-size:15px}.opt span{font-size:13px;color:var(--slate-500)}
.opt.on{background:var(--coral-soft);box-shadow:inset 0 0 0 2px var(--coral)}
@media (max-width:900px){.two,.cmp{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition-property:opacity,color,background-color,border-color!important}button:active{transform:none}}
</style>
</head>
<body>
<div class="mockbar"><strong>Mockup · clinica-4</strong>
  <button id="m-fotos" class="on">Fotos</button><button id="m-cons">Consentimiento</button><button id="m-inf">Informe PDF</button>
  <span class="note">Datos de ejemplo inventados</span></div>
<div class="stage"><div class="device"><div id="screen"></div></div></div>

<script>
const PRO="Lucía Martín", COL="Col. 45-0312", CLINIC="Clínica Podológica Demo";
let tab="fotos", camOpen=false, fotoZona=null, fotos=[
  {z:"Pie izq. · Dedo gordo", d:"7 sep", c:["#e3b19c","#9b6450"]},
  {z:"Pie izq. · Dedo gordo", d:"21 sep", c:["#e9bfa9","#a8735e"]},
  {z:"Pie der. · Talón", d:"21 sep", c:["#dcae98","#8f5f4c"]}],
  cmpZona="Pie izq. · Dedo gordo";
let consTpl=null, firmado={}, drew=false;
let infTipo="resumen", infDest="paciente", entregado=null;
const ZONAS_HOY=["Pie izq. · Dedo gordo","Pie der. · Bajo el dedo gordo","Pie der. · Talón"];
const TPL=[
  {id:"ung",n:"Cirugía de uña (matricectomía)",req:true,txt:"Se me ha explicado en qué consiste la cirugía parcial de la uña, la anestesia local que se usará, los cuidados posteriores y los riesgos (infección, recaída, molestias durante unos días). He podido preguntar y entiendo las respuestas."},
  {id:"anes",n:"Anestesia local",req:true,txt:"Autorizo la aplicación de anestesia local en el pie. Se me ha preguntado por alergias a anestésicos y medicación que tomo."},
  {id:"foto",n:"Uso de fotos en mi historia",req:false,txt:"Autorizo que se hagan fotos de mis pies para seguir la evolución del tratamiento. Las fotos solo forman parte de mi historia clínica y no se usan para nada más."}];

const head=()=>`<h1 class="name">Carmen Rodríguez López</h1>
  <div class="facts"><div class="fact"><span>Edad</span>78 años</div><div class="fact"><span>Cita de hoy</span>10:30 · Cirugía de uña</div><div class="fact"><span>Atiende</span>${PRO}</div></div>
  <div class="alerts" role="alert"><span class="lbl"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>Cuidado</span><span class="a">Diabética</span><span class="a">Anticoagulada</span><span class="a">Alérgica al látex</span></div>`;
const img=c=>`background:linear-gradient(135deg,${c[0]},${c[1]})`;

function render(){
  ["fotos","cons","inf"].forEach(t=>document.getElementById("m-"+({fotos:"fotos",cons:"cons",inf:"inf"})[t]).classList.toggle("on",tab===t));
  document.getElementById("screen").innerHTML=`<div class="main">${head()}
    <div class="tabs"><button data-tab="fotos" class="${tab==='fotos'?'on':''}">Fotos</button><button data-tab="cons" class="${tab==='cons'?'on':''}">Consentimientos</button><button data-tab="inf" class="${tab==='inf'?'on':''}">Informe</button></div>
    ${tab==="fotos"?fotosV():tab==="cons"?consV():infV()}</div>`;
  if(tab==="cons"&&consTpl&&!firmado[consTpl]) setupSig();
}

function fotosV(){
  if(!firmado.foto) return `<div class="card"><h2>Fotos</h2><div class="sub">Antes de la primera foto, la paciente tiene que firmar el consentimiento de fotos.</div>
    <div class="row"><button class="cta" data-go-cons="foto">Firmar consentimiento de fotos</button></div></div>`;
  if(camOpen) return `<div class="card"><h2>Nueva foto</h2><div class="sub">¿De qué zona es? Elige antes de disparar.</div>
    <div class="chips">${ZONAS_HOY.map(z=>`<button class="chip ${fotoZona===z?'on':''}" data-fz="${z}">${z}</button>`).join("")}<button class="chip">Otra zona…</button></div>
    <div class="cam" style="margin-top:12px"><div class="ph"></div><div class="guide"></div><button class="shutter" data-a="shoot" ${fotoZona?'':'disabled'} aria-label="Hacer foto"></button></div>
    <div class="row"><button class="ghost" data-a="camclose">Cancelar</button>${fotoZona?"":`<span class="why">Elige la zona para poder disparar.</span>`}</div>
    <div class="small" style="margin-top:8px">La foto se guarda en la historia, nunca en la galería de la tablet.</div></div>`;
  const zonas=[...new Set(fotos.map(f=>f.z))];
  const cmp=fotos.filter(f=>f.z===cmpZona);
  return `<div class="card"><h2>Fotos</h2><div class="sub">Por zona, en orden de fecha. Toca una zona para comparar antes y después.</div>
    <div class="row" style="margin-top:0"><button class="cta" data-a="camopen">Hacer foto</button></div>
    <div class="label">Comparar</div><div class="chips">${zonas.map(z=>`<button class="chip ${cmpZona===z?'on':''}" data-cz="${z}">${z}</button>`).join("")}</div>
    ${cmp.length>=2?`<div class="cmp" style="margin-top:12px"><div><div class="img" style="${img(cmp[0].c)}"></div><div class="cap">Antes · ${cmp[0].d}</div></div><div><div class="img" style="${img(cmp[cmp.length-1].c)}"></div><div class="cap">Última · ${cmp[cmp.length-1].d}</div></div></div>`
      :`<div class="small" style="margin-top:10px">Solo hay una foto de esta zona. Con la segunda podrás comparar.</div>`}
    <div class="label">Todas</div><div class="grid">${fotos.map(f=>`<button class="thumb"><div class="img" style="${img(f.c)}"></div><div class="t">${f.z}<br>${f.d}</div></button>`).join("")}</div></div>`;
}

function consV(){
  if(!consTpl) return `<div class="card"><h2>Consentimientos</h2><div class="sub">El de hoy lo pide la cita: cirugía de uña con anestesia. La sesión no se puede empezar sin él.</div>
    ${TPL.map(t=>`<button class="opt" data-tpl="${t.id}"><b>${t.n}${firmado[t.id]?" · firmado ✓":""}</b><span>${firmado[t.id]?"Firmado hoy · PDF en la historia":(t.req?"Lo pide la cita de hoy":"Opcional")}</span></button>`).join("")}</div>`;
  const t=TPL.find(x=>x.id===consTpl);
  if(firmado[t.id]) return `<div class="card"><h2>${t.n}</h2><div class="ok">Firmado por Carmen Rodríguez López hoy a las 10:34, delante de ${PRO} (${COL}). PDF guardado en la historia.</div>
    <div class="row"><button class="ghost" data-a="consback">Volver a la lista</button></div></div>`;
  return `<div class="card"><h2>${t.n}</h2><div class="sub">Léelo con la paciente y que firme con el dedo.</div>
    <div class="doc">${t.txt}<br><br>Paciente: <b>Carmen Rodríguez López</b>.</div>
    <div class="sig"><canvas id="sig"></canvas><span class="hint" id="hint">Firme aquí con el dedo</span></div>
    <div class="row"><button class="cta" data-a="sign" ${drew?'':'disabled'}>Firmar</button><button class="ghost" data-a="clearsig">Borrar firma</button><button class="ghost" data-a="consback">Cancelar</button>
    ${drew?"":`<span class="why">Falta la firma.</span>`}</div></div>`;
}

function setupSig(){
  const c=document.getElementById("sig"); if(!c) return;
  const r=c.getBoundingClientRect(); c.width=r.width*2; c.height=r.height*2;
  const x=c.getContext("2d"); x.scale(2,2); x.lineWidth=2.5; x.lineCap="round"; x.strokeStyle="#1F2937";
  let down=false;
  const pos=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{down=true;x.beginPath();x.moveTo(...pos(e));};
  c.onpointermove=e=>{if(!down)return;x.lineTo(...pos(e));x.stroke();if(!drew){drew=true;document.getElementById("hint").style.display="none";document.querySelector('[data-a=sign]').disabled=false;const w=document.querySelector('.why');if(w)w.remove();}};
  c.onpointerup=c.onpointerleave=()=>down=false;
}

function infV(){
  const tipos=[["resumen","Resumen de la historia","Alertas, valoración, tratamientos y evolución. Para el paciente."],
    ["sesiones","Últimas sesiones","Las 5 últimas con la gráfica del dolor."],
    ["deriv","Derivación","Para otro profesional: motivo, lo encontrado y lo hecho."],
    ["completa","Historia completa","Cuando el paciente la pide (derecho de acceso)."]];
  return `<div class="two"><div class="card"><h2>Informe</h2><div class="sub">Elige qué necesitas.</div>
    ${tipos.map(([k,n,d])=>`<button class="opt ${infTipo===k?'on':''}" data-inf="${k}"><b>${n}</b><span>${d}</span></button>`).join("")}
    <div class="label">¿Para quién?</div><div class="chips">${[["paciente","La paciente"],["prof","Otro profesional"]].map(([k,n])=>`<button class="chip ${infDest===k?'on':''}" data-dest="${k}">${n}</button>`).join("")}</div>
    <div class="row"><button class="cta" data-a="print">Imprimir</button><button class="ghost" data-a="mail">Enviar por email</button></div>
    ${entregado?`<div class="ok">${entregado}. Queda apuntado en la historia y en el registro de accesos.</div>`:""}</div>
    <div class="paper"><div class="hd"><div><h3>${CLINIC}</h3><div class="small">${PRO} · Podóloga · ${COL}</div></div><div class="small" style="text-align:right">Informe ${({resumen:"resumen",sesiones:"de sesiones",deriv:"de derivación",completa:"· historia completa"})[infTipo]}<br>6 oct 2026</div></div>
      <div><b>Carmen Rodríguez López</b> · 78 años</div>
      <div class="sec">Alertas</div><div>Diabética · Anticoagulada (Sintrom) · Alérgica al látex</div>
      ${infTipo==="deriv"?`<div class="sec">Motivo de la derivación</div><div style="color:var(--slate-500)">[Texto breve que escribe la podóloga al elegir «Derivación»]</div>`:""}
      <div class="sec">Lo encontrado</div><div>Pie izq.: uña encarnada en dedo gordo (moderada). Pie der.: dureza bajo el dedo gordo y en el talón (leve). Pulsos presentes. Sensibilidad conservada.</div>
      <div class="sec">Sesiones</div><table><tr><td>7 sep</td><td>Quiropodia · corte y fresado</td><td>Dolor 7</td></tr><tr><td>21 sep</td><td>Quiropodia · corte y fresado</td><td>Dolor 5</td></tr><tr><td>6 oct</td><td>Cirugía de uña</td><td>Dolor 3</td></tr></table>
      <div class="sec">Recomendaciones</div><div>Calzado ancho. Hidratar cada día. No cortar callos en casa.</div>
      <div class="sec">Firma</div><div>${PRO} · ${COL}</div></div></div>`;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||b.disabled) return;
  const d=b.dataset;
  if(b.id==="m-fotos"||d.tab==="fotos") tab="fotos"; else if(b.id==="m-cons"||d.tab==="cons") tab="cons"; else if(b.id==="m-inf"||d.tab==="inf") tab="inf";
  else if(d.goCons){tab="cons";consTpl=d.goCons;drew=false;}
  else if(d.a==="camopen"){camOpen=true;fotoZona=null;}
  else if(d.a==="camclose"){camOpen=false;}
  else if(d.fz){fotoZona=d.fz;}
  else if(d.a==="shoot"){fotos.push({z:fotoZona,d:"Hoy",c:["#e7c2ae","#b07d66"]});cmpZona=fotoZona;camOpen=false;}
  else if(d.cz){cmpZona=d.cz;}
  else if(d.tpl){consTpl=d.tpl;drew=false;}
  else if(d.a==="sign"){firmado[consTpl]=true;}
  else if(d.a==="clearsig"){drew=false;}
  else if(d.a==="consback"){consTpl=null;}
  else if(d.inf){infTipo=d.inf;entregado=null;}
  else if(d.dest){infDest=d.dest;entregado=null;}
  else if(d.a==="print"){entregado=`Impreso hoy a las 11:02 para ${infDest==="paciente"?"la paciente":"otro profesional"}`;}
  else if(d.a==="mail"){entregado=infDest==="paciente"?"Enviado a c.rodriguez@ejemplo.com hoy a las 11:02":"Enviado al email que indiques del profesional (se pide al pulsar)";}
  else return;
  render();
});
render();
</script>
</body>
</html>
