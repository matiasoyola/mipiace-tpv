<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Venta · oscuro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2A08F}a:hover{color:#FFFFFF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1443px; height: 812px; box-sizing: border-box; display: flex; background: #0E1013; font-family: 'DM Sans', system-ui, sans-serif; color: #F1F3F5; font-feature-settings: 'cv11', 'ss01';">

  <div style="width: 420px; flex-shrink: 0; display: flex; flex-direction: column; background: #171A1F; border-right: 1px solid #23272E;">
    <div style="height: 72px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px;">
      <a href="Mesas.dc.html" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 14px; background: #23272E; color: #F1F3F5; text-decoration: none;" aria-label="Volver a mesas">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 26px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.1;">M1</span>
        <span style="font-size: 15px; color: #8B93A1;">Salón · Salomé</span>
      </div>
    </div>

    <div style="flex-grow: 1; padding: 4px 12px; display: flex; flex-direction: column; gap: 4px; overflow: hidden;">
      <div style="padding: 6px 8px; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: #8B93A1;">EN COCINA · 10:07</div>
      <sc-for list="{{sent}}" as="l" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 10px; border-radius: 12px; color: #8B93A1;">
          <span style="width: 28px; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums;">{{l.qty}}</span>
          <span style="flex-grow: 1; font-size: 21px; font-weight: 500;">{{l.name}}</span>
          <span style="font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums;">{{l.total}}</span>
        </div>
      </sc-for>
      <div style="padding: 12px 8px 6px; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: #F2A08F;">SIN ENVIAR</div>
      <sc-for list="{{pending}}" as="l" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 68px; padding: 0 8px; border-radius: 14px; {{l.row}}">
          <button style="flex-shrink: 0; width: 56px; height: 56px; border-radius: 14px; border: 0; background: #2C313A; color: #FFFFFF; font-size: 30px; font-weight: 600; line-height: 1; display: flex; align-items: center; justify-content: center;" aria-label="Una menos">−</button>
          <span style="flex-shrink: 0; width: 30px; text-align: center; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums;">{{l.qty}}</span>
          <button style="flex-shrink: 0; width: 56px; height: 56px; border-radius: 14px; border: 0; background: #2C313A; color: #FFFFFF; font-size: 30px; font-weight: 600; line-height: 1; display: flex; align-items: center; justify-content: center;" aria-label="Una más">+</button>
          <span style="flex-grow: 1; min-width: 0; font-size: 23px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{l.name}}</span>
          <span style="flex-shrink: 0; font-size: 23px; font-weight: 600; font-variant-numeric: tabular-nums;">{{l.total}}</span>
        </div>
      </sc-for>
    </div>

    <div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #23272E;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: #8B93A1;">TOTAL</span>
        <span style="font-size: 46px; font-weight: 600; letter-spacing: -0.025em; font-variant-numeric: tabular-nums;">17,50 €</span>
      </div>
      <div style="display: flex; gap: 10px;">
        <button style="flex: 1; height: 68px; border-radius: 16px; border: 1px solid #3A404A; background: transparent; color: #F1F3F5; font-size: 20px; font-weight: 600;">Enviar</button>
        <button style="flex: 1.3; height: 68px; border-radius: 16px; border: 0; background: #E97058; color: #FFFFFF; font-size: 22px; font-weight: 600;">Cobrar</button>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; padding: 16px; gap: 14px; box-sizing: border-box;">
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; flex-shrink: 0;">
      <sc-for list="{{fams}}" as="f" hint-placeholder-count="10">
        <button style="height: 76px; border: 0; border-radius: 14px; font-size: 22px; font-weight: 600; cursor: pointer; {{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
    <div style="height: 1px; background: #23272E; flex-shrink: 0;"></div>
    <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
      <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: #8B93A1; margin-right: 6px;">CANTIDAD</span>
      <sc-for list="{{qtys}}" as="q" hint-placeholder-count="6">
        <button style="width: 64px; height: 56px; border-radius: 12px; border: 0; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; {{q.style}}">{{q.n}}</button>
      </sc-for>
      <span style="font-size: 15px; color: #8B93A1; margin-left: 10px;">toca el número y luego el producto · vuelve a 1</span>
    </div>
    <div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{items}}" as="p" hint-placeholder-count="20">
        <button style="position: relative; border: 0; border-radius: 12px; padding: 0 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; cursor: pointer; overflow: hidden; {{p.fill}}">
          <span style="font-size: 24px; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em;">{{p.name}}</span>
          <sc-if value="{{p.hasQty}}" hint-placeholder-val="{{false}}">
            <span style="flex-shrink: 0; min-width: 40px; height: 40px; padding: 0 8px; box-sizing: border-box; border-radius: 10px; background: #15171B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums;">{{p.qty}}</span>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1443,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    const C = {
      cafes:      { label: 'Cafés',     c: '#F3B992' },
      desayunos:  { label: 'Desayunos', c: '#CACD8C' },
      cervezas:   { label: 'Cervezas',  c: '#E1C487' },
      refrescos:  { label: 'Refrescos', c: '#86D5EE' },
      vinos:      { label: 'Vinos',     c: '#D8B8F1' },
      licores:    { label: 'Licores',   c: '#A7C9FF' },
      raciones:   { label: 'Raciones',  c: '#96D9B4' },
      bocadillos: { label: 'Bocatas',   c: '#F3B1CF' },
      platos:     { label: 'Platos',    c: '#B0D49D' }
    };
    const raw = [
      ['Café con leche','cafes',1],['Cortado','cafes',0],['Café solo','cafes',0],['Caña','cervezas',2],
      ['Botellín','cervezas',0],['Tostada tomate','desayunos',1],['Croissant','desayunos',0],['Tostada jamón','desayunos',0],
      ['Tinto verano','refrescos',0],['Coca-Cola','refrescos',0],['Pincho tortilla','desayunos',0],['Mahou tercio','cervezas',0],
      ['Agua','refrescos',0],['Ribera','vinos',0],['Aquarius','refrescos',0],['Montado','bocadillos',0],
      ['Cola Cao','cafes',0],['Rioja','vinos',0],['Bocadillo','bocadillos',0],['Croquetas','raciones',1]
    ];
    const items = raw.map(([name, cat, q]) => ({ name, hasQty: q > 0, qty: '×' + q, fill: `background: ${C[cat].c}; color: #15171B;` }));
    const order = ['cafes','desayunos','cervezas','refrescos','vinos','licores','raciones','bocadillos','platos'];
    const fams = [{ label: 'Ahora', style: 'background: #F1F3F5; color: #0E1013; box-shadow: 0 0 0 3px #0E1013, 0 0 0 6px #F1F3F5;' }]
      .concat(order.map(k => ({ label: C[k].label, style: `background: ${C[k].c}; color: #15171B;` })));
    const sent = [
      { qty: '1', name: 'Café con leche', total: '1,60 €' },
      { qty: '1', name: 'Tostada tomate', total: '2,50 €' }
    ];
    const pending = [
      { qty: '2', name: 'Caña', total: '3,40 €', row: 'background: rgba(233,112,88,0.16);' },
      { qty: '1', name: 'Croquetas', total: '10,00 €', row: '' }
    ];
    const qtys = ['1','2','3','4','5','6'].map(n => ({ n, style: n === '1' ? 'background: #F1F3F5; color: #0E1013;' : 'background: #1C2026; color: #E4E7EB;' }));
    return { items, fams, sent, pending, qtys };
  }
}
</script>
</body>
</html>
