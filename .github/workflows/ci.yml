# CI de mipiacetpv (v1.5-consistencia-A · Lote 2; publish v1.5-B · Lote 1).
#
# Job `ci`: replica lo que hace el Dockerfile en build — que es donde
# revientan los deploys: install congelado, prisma generate, typecheck
# de todos los targets, suite de tests y builds de Vite.
#
# La suite NO necesita servicios (Redis/Postgres van mockeados desde el
# Lote 1); si algún test futuro necesita Redis real, añadir `services:
# redis:7` aquí — preferible mantener la suite autocontenida.
#
# Job `smoke` (v1.10.1): arranca la imagen `api` real contra Postgres y
# Redis de servicio y le pide /health. Existe porque `ci` NUNCA arranca
# el proceso — el 2026-08-19 pasó en verde con un bug que lo mataba.
#
# Job `e2e` (v1.13): levanta Postgres, aplica las migraciones de verdad
# y corre el ciclo de caja entero (`pnpm test:e2e`). Fuera de `needs` de
# `publish` mientras se estabiliza — no bloquea, pero se ve rojo.
#
# Job `publish` (v1.5-B · Lote 1): sólo en push a master y tras `ci` y
# `smoke` en verde. Construye con buildx las imágenes `api` y `static-publish` y
# las publica en GHCR con dos tags: `<sha-corto>` (inmutable, para
# rollback) y `latest`. El VPS ya no construye nada — `infra/deploy.sh`
# hace pull y recrea (rollback = IMAGE_TAG=<sha-anterior> ./deploy.sh).

name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm 9.12.0 exacto — lo lee del campo `packageManager` del
      # package.json raíz (misma fuente de verdad que corepack en el
      # Dockerfile).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # v1.5-hotfix7 · runners migran a Node 24 el 2026-06-16: checkout y
      # setup-node suben a v5 (Node 24); pnpm/action-setup y las docker
      # actions van con major flotante y migran solas. node-version: 20
      # se mantiene — es el Node DEL PROYECTO (el del Dockerfile), no el
      # del runner.
      - name: Setup Node 20 + cache pnpm store
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @mipiacetpv/db run generate

      - name: Typecheck API
        run: pnpm --filter @mipiacetpv/api exec tsc --noEmit

      - name: Typecheck packages
        run: |
          for pkg in packages/db packages/escpos-builder packages/holded-client packages/ticket-model packages/ticket-pdf packages/util-validation; do
            echo "== $pkg"
            (cd "$pkg" && pnpm exec tsc --noEmit)
          done

      # Los frontends usan project references (`tsc -b`), igual que su
      # script de build. Caza los errores de tipos antes de la build.
      - name: Typecheck tpv-web
        run: pnpm --filter @mipiacetpv/tpv-web exec tsc -b

      - name: Typecheck admin
        run: pnpm --filter @mipiacetpv/admin exec tsc -b

      - name: Tests
        run: pnpm test

      - name: Build admin (Vite)
        run: pnpm --filter @mipiacetpv/admin build

      - name: Build tpv-web (Vite)
        run: pnpm --filter @mipiacetpv/tpv-web build

  # v1.10.1 · paso de humo — la lección del despliegue revertido del
  # 2026-08-19. El job `ci` pasó en verde con un bug que mataba el
  # arranque (`rrule` no declara `exports`, así que Node resuelve su
  # `main` CommonJS y el named import de ESM revienta al instanciar el
  # módulo). Typecheck, vitest y las builds de Vite NUNCA arrancan el
  # proceso: la única red que lo cazó fue el healthcheck de `deploy.sh`,
  # ya en producción.
  #
  # Aquí se construye la imagen `api` de verdad y se arranca contra un
  # Postgres y un Redis de servicio, con las mismas variables que el
  # compose de producción, y se le pide `/health`. Si el proceso no
  # levanta, el CI se pone rojo en dos minutos en vez de costar un
  # despliegue revertido.
  #
  # NO corre migraciones a propósito: lo que se valida es que el proceso
  # arranca y sirve, no el esquema.
  smoke:
    needs: ci
    runs-on: ubuntu-latest

    # Mismas versiones que infra/docker-compose.prod.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mipiacetpv
          POSTGRES_PASSWORD: mipiacetpv
          POSTGRES_DB: mipiacetpv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mipiacetpv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      # `load: true` y sin push: la imagen se queda en el daemon del
      # runner. Comparte la cache gha con `publish`, asi que el build
      # pesado se paga una sola vez por commit.
      - name: Build imagen api (local, sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: api
          push: false
          load: true
          tags: mipiacetpv-api:smoke
          build-args: |
            GIT_SHA=${{ github.sha }}
            VITE_BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `--network host` porque los `services` del runner escuchan en su
      # localhost, no en una red Docker que el contenedor vea.
      #
      # Los secretos son de usar y tirar, pero respetan el schema de
      # apps/api/src/env.ts: JWT >= 32 caracteres, SUPER_ADMIN >= 40 y
      # distinto del default `dev-only-...` (con NODE_ENV=production el
      # server lanza si detecta el default), y HOLDED_KEY_ENCRYPTION_SECRET
      # base64 de exactamente 32 bytes.
      - name: Arrancar el contenedor
        run: |
          docker run -d --name api-smoke --network host \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e HOST=0.0.0.0 \
            -e DATABASE_URL='postgresql://mipiacetpv:mipiacetpv@127.0.0.1:5432/mipiacetpv' \
            -e REDIS_URL='redis://127.0.0.1:6379' \
            -e CORS_ORIGINS='http://localhost:5173' \
            -e JWT_ACCESS_SECRET="$(openssl rand -base64 48)" \
            -e JWT_REFRESH_SECRET="$(openssl rand -base64 48)" \
            -e SUPER_ADMIN_JWT_SECRET="$(openssl rand -base64 48)" \
            -e HOLDED_KEY_ENCRYPTION_SECRET="$(openssl rand -base64 32)" \
            -e PRODUCT_IMAGE_CACHE_DIR=/tmp/product-images \
            -e Z_REPORT_STORAGE_ROOT=/tmp/z-reports \
            mipiacetpv-api:smoke

      - name: Pedir /health
        run: |
          for i in $(seq 1 30); do
            if body="$(curl -fsS --max-time 5 http://127.0.0.1:3001/health)"; then
              echo "$body"
              if echo "$body" | grep -q '"ok":true'; then exit 0; fi
              echo "::error::/health respondio sin ok:true"
              exit 1
            fi
            # Si el proceso ya ha muerto, fallar ya y no esperar los 60s.
            if [ "$(docker inspect -f '{{.State.Running}}' api-smoke 2>/dev/null)" != "true" ]; then
              echo "::error::El contenedor se paro antes de servir /health"
              exit 1
            fi
            sleep 2
          done
          echo "::error::/health no respondio en 60s"
          exit 1

      # Pase o falle: los logs son lo que dice POR QUE no arranco.
      - name: Logs del contenedor
        if: always()
        run: docker logs api-smoke --tail=200 || true

  # v1.13-e2e-ciclo-de-caja · el ciclo de caja contra Postgres de verdad.
  #
  # `ci` corre la suite con prisma FALSO: fija la lógica, pero nunca ha
  # visto el ciclo entero (abrir turno → vender → corte de día a las
  # cinco → tickets de un terminal que estuvo sin red → resumen → cerrar)
  # tocando una base real. Este job aplica las migraciones DE VERDAD
  # (`prisma migrate deploy` sobre base limpia, así se prueba también la
  # migración) y corre `pnpm test:e2e`.
  #
  # 2026-08-31 · SÍ está en `needs` de `publish`. Nació fuera "mientras se
  # estabiliza" (§3 del prompt), pero v1.13 es la puerta de D2 y una puerta
  # que no cierra no es una puerta: el corte de día cierra turnos solo a las
  # 5:00 y es justo lo que esta suite prueba contra Postgres de verdad.
  #
  # Sin Redis: la suite mockea el encolado BullMQ en el borde, igual que
  # el resto de tests. Lo que se prueba aquí es la caja, no el ERP.
  e2e:
    needs: ci
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mipiacetpv
          POSTGRES_PASSWORD: mipiacetpv
          POSTGRES_DB: mipiacetpv_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mipiacetpv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20 + cache pnpm store
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @mipiacetpv/db run generate

      # La suite hace DROP SCHEMA public y aplica las migraciones antes de
      # empezar. `E2E_DATABASE_URL` (y no `DATABASE_URL`) es deliberado:
      # nadie puede disparar esto por accidente contra su base de trabajo.
      # Sin la variable la suite se salta en local — pero en CI falla, que
      # es lo que evita un verde que miente.
      - name: e2e del ciclo de caja
        env:
          E2E_DATABASE_URL: postgresql://mipiacetpv:mipiacetpv@127.0.0.1:5432/mipiacetpv_e2e
        run: pnpm test:e2e

  # v1.5-consistencia-B · Lote 1: publicación de imágenes en GHCR.
  # Sólo en push a master (las ramas validan con `ci` pero no publican).
  # GITHUB_TOKEN basta para escribir en ghcr.io del mismo repo/owner
  # gracias al bloque `permissions`.
  publish:
    # v1.10.1 · no se publica una imagen que no arranca.
    # v1.13 · ni una que no pase el ciclo de caja contra Postgres real.
    needs: [ci, smoke, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Short SHA
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VITE_BUILD_HASH = release de Sentry en los frontends (Lote 2) y
      # hash determinista del SW. VITE_SENTRY_DSN es opcional: sin el
      # secret, llega vacío y Sentry queda en no-op (gated por DSN).
      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: api
          push: true
          tags: |
            ghcr.io/matiasoyola/mipiacetpv-api:${{ steps.meta.outputs.sha }}
            ghcr.io/matiasoyola/mipiacetpv-api:latest
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
            VITE_BUILD_HASH=${{ steps.meta.outputs.sha }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push static-publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: static
          push: true
          tags: |
            ghcr.io/matiasoyola/mipiacetpv-static-publish:${{ steps.meta.outputs.sha }}
            ghcr.io/matiasoyola/mipiacetpv-static-publish:latest
          build-args: |
            VITE_BUILD_HASH=${{ steps.meta.outputs.sha }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
